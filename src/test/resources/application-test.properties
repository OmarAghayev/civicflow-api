# Test Database Configuration (H2 In-Memory)
spring.datasource.url=jdbc:h2:mem:civicflow_test_db;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Hibernate DDL Auto for Slice Testing
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# Disable Flyway during slice unit tests to avoid migration race conditions
spring.flyway.enabled=false