# Server Port
server.port=8080

# Security & JWT Configuration
application.security.jwt.secret-key=404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970
application.security.jwt.expiration-ms=86400000

# OAuth2 / OIDC Client Registration
spring.security.oauth2.client.registration.google.client-id=civicflow-public-google-client-id
spring.security.oauth2.client.registration.google.client-secret=civicflow-public-google-client-secret
spring.security.oauth2.client.registration.google.scope=openid,profile,email

spring.security.oauth2.client.registration.github.client-id=civicflow-public-github-client-id
spring.security.oauth2.client.registration.github.client-secret=civicflow-public-github-client-secret
spring.security.oauth2.client.registration.github.scope=read:user,user:email

# JPA & Hibernate Validation (Managed by Flyway)
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.jdbc.batch_size=25
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true

# Flyway Database Migration
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.locations=classpath:db/migration

# Database DataSource (H2 in-memory)
spring.datasource.url=jdbc:h2:mem:civicflowdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Redis Configuration (Local)
spring.data.redis.host=localhost
spring.data.redis.port=6379