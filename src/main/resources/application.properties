# OAuth2 / OIDC Client Registration
spring.security.oauth2.client.registration.google.client-id=civicflow-public-google-client-id
spring.security.oauth2.client.registration.google.client-secret=civicflow-public-google-client-secret
spring.security.oauth2.client.registration.google.scope=openid,profile,email

spring.security.oauth2.client.registration.github.client-id=civicflow-public-github-client-id
spring.security.oauth2.client.registration.github.client-secret=civicflow-public-github-client-secret
spring.security.oauth2.client.registration.github.scope=read:user,user:email